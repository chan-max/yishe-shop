<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- S-Shaped Hook (Top) -->
  <path d="M50 35 
           C 65 35, 70 25, 70 18
           C 70 10, 60 5, 52 5
           C 40 5, 35 12, 35 18
           C 35 25, 45 28, 50 35" 
        stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Side of the T-shirt (The "1") -->
  <g stroke="#1A1A1A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shoulder to Sleeve (The tick of the 1) -->
    <path d="M50 35 L28 42 L25 55 L38 58" />
    <!-- Vertical Body Side (The stem of the 1) -->
    <path d="M38 58 V90" />
    <!-- Partial bottom hem (Optional, keeps it clean) -->
    <path d="M38 90 H50" stroke-width="4" opacity="0.3"/>
  </g>
</svg>
