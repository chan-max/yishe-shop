name: Deploy Nuxt site to Tencent Cloud

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package version changed
        id: version_check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "current_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_CONTENT=$(git show HEAD^:package.json 2>/dev/null || true)

          if [ -z "$PREVIOUS_CONTENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(printf '%s' "$PREVIOUS_CONTENT" | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => console.log(JSON.parse(data).version || ''))")

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Detect package manager
        if: steps.version_check.outputs.changed == 'true'
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "command=install" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "command=install" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "command=ci" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup pnpm
        if: steps.version_check.outputs.changed == 'true' && steps.detect-package-manager.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: |
            pnpm-lock.yaml
            yarn.lock
            package-lock.json

      - name: Restore cache
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            .output
            .nuxt
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('.output') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true'
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Static HTML export with Nuxt
        if: steps.version_check.outputs.changed == 'true'
        run: ${{ steps.detect-package-manager.outputs.manager }} run generate

      - name: Verify build output
        if: steps.version_check.outputs.changed == 'true'
        run: |
          echo "Checking build output..."
          ls -la .output/ || echo ".output directory not found"
          ls -la .output/public/ || echo ".output/public directory not found"
          find .output/public -type f | head -20 || echo "No files found in .output/public"

      - name: Deploy to Tencent Cloud
        if: steps.version_check.outputs.changed == 'true'
        id: deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: ".output/public/**"
          target: "/www/wwwroot/1s.design"
          rm: false
          strip_components: 2
          overwrite: true
          command_timeout: "10m"
          timeout: "10m"
          debug: true

      - name: Skip deploy when package version is unchanged
        if: steps.version_check.outputs.changed != 'true'
        run: echo "package.json version unchanged, skipping build and deploy."

      - name: Send Feishu Notification
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const status = '${{ job.status }}';
            const skipped = '${{ steps.version_check.outputs.changed }}' !== 'true';
            const versionText = skipped
              ? '版本号未变化，已跳过编译部署'
              : `部署版本: ${{ steps.version_check.outputs.current_version }}`;
            const emoji = skipped ? '⏭️' : status === 'success' ? '🎉' : '❌';
            const commitMessage = `${{ github.event.head_commit.message || '' }}` || '手动触发';
            const message = {
              msg_type: 'text',
              content: {
                text: `${emoji} 衣设前端 Nuxt 项目${skipped ? '跳过部署' : status === 'success' ? '部署成功' : '部署失败'}！\n\n项目: ${{ github.repository }}\n分支: ${{ github.ref }}\n提交者: ${{ github.actor }}\n提交信息: ${commitMessage}\n${versionText}\n时间: ${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}`
              }
            };

            await fetch('${{ secrets.FEISHU_WEBHOOK_URL }}', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(message)
            });
