name: Deploy Nuxt site to Tencent Cloud

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
  workflow_dispatch:

concurrency:
  group: yishe-shop-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package version changed
        id: version_check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "current_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PREVIOUS_CONTENT=$(git show HEAD^:package.json 2>/dev/null || true)

          if [ -z "$PREVIOUS_CONTENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREVIOUS_VERSION=$(printf '%s' "$PREVIOUS_CONTENT" | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => console.log(JSON.parse(data).version || ''))")

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.version_check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Build Nuxt SSR app
        if: steps.version_check.outputs.changed == 'true'
        run: npm run build

      - name: Include unhead runtime files
        if: steps.version_check.outputs.changed == 'true'
        shell: bash
        run: |
          if grep -R "from 'unhead/\|from \"unhead/" .output/server/chunks >/dev/null 2>&1; then
            rm -rf .output/server/node_modules/unhead
            mkdir -p .output/server/node_modules/unhead
            cp -R node_modules/@unhead/vue/node_modules/unhead/. .output/server/node_modules/unhead/
          fi

      - name: Verify build output
        if: steps.version_check.outputs.changed == 'true'
        run: |
          echo "Checking build output..."
          ls -la .output/ || echo ".output directory not found"
          ls -la .output/server/ || echo ".output/server directory not found"
          ls -la .output/public/ || echo ".output/public directory not found"
          test -f .output/server/index.mjs
          if grep -R "from 'unhead/\|from \"unhead/" .output/server/chunks >/dev/null 2>&1; then
            test -f .output/server/node_modules/unhead/dist/server.mjs
          fi

      - name: Package build artifacts
        if: steps.version_check.outputs.changed == 'true'
        run: tar -czf nuxt-output.tar.gz .output

      - name: Upload package to Tencent Cloud
        if: steps.version_check.outputs.changed == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "nuxt-output.tar.gz"
          target: "/tmp"
          command_timeout: "10m"
          timeout: "10m"
          debug: true

      - name: Deploy SSR app on Tencent Cloud
        if: steps.version_check.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            mkdir -p /www/wwwroot/1s.design
            tar -xzf /tmp/nuxt-output.tar.gz -C /tmp
            rm -rf /www/wwwroot/1s.design/.output
            cp -r /tmp/.output /www/wwwroot/1s.design/.output
            rm -rf /tmp/.output
            rm -f /tmp/nuxt-output.tar.gz

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            cd /www/wwwroot/1s.design
            if pm2 describe yishe-shop >/dev/null 2>&1; then
              NODE_ENV=production PORT=3000 HOST=0.0.0.0 pm2 restart yishe-shop --update-env
            else
              NODE_ENV=production PORT=3000 HOST=0.0.0.0 pm2 start .output/server/index.mjs --name yishe-shop
            fi
            pm2 save
          command_timeout: "10m"
          timeout: "10m"
          debug: true

      - name: Skip deploy when package version is unchanged
        if: steps.version_check.outputs.changed != 'true'
        run: echo "package.json version unchanged, skipping build and deploy."
