name: 飞书机器人通知

on:
  push:
    branches: [ main, master, develop, feature/*, hotfix/*, release/* ]
  pull_request:
    branches: [ main, master, develop ]
  create:
  delete:
  fork:
  gollum:
  issues:
  issue_comment:
  watch:
  release:
  deployment:
  deployment_status:
  public:
  repository_dispatch:

jobs:
  notify-feishu:
    runs-on: ubuntu-latest
    steps:
      - name: 获取事件信息
        id: event_info
        run: |
          python3 - <<'PY'
          import json
          import os
          import time

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)

          def write_output(name, value):
              delimiter = f"EOF_{name}_{time.time_ns()}"
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"{name}<<{delimiter}\n")
                  output.write(f"{'' if value is None else value}\n")
                  output.write(f"{delimiter}\n")

          write_output("event_name", os.environ.get("GITHUB_EVENT_NAME", ""))
          write_output("ref", os.environ.get("GITHUB_REF", ""))
          write_output("ref_name", os.environ.get("GITHUB_REF_NAME", ""))
          write_output("sha", os.environ.get("GITHUB_SHA", ""))
          write_output("repository", os.environ.get("GITHUB_REPOSITORY", ""))
          write_output("actor", os.environ.get("GITHUB_ACTOR", ""))
          write_output("workflow", os.environ.get("GITHUB_WORKFLOW", ""))

          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              head_commit = event.get("head_commit") or {}
              author = head_commit.get("author") or {}
              write_output("commit_message", head_commit.get("message", ""))
              write_output("commit_author", author.get("name", ""))
              write_output("commit_date", head_commit.get("timestamp", ""))

          if os.environ.get("GITHUB_EVENT_NAME") == "pull_request":
              pull_request = event.get("pull_request") or {}
              user = pull_request.get("user") or {}
              write_output("pr_title", pull_request.get("title", ""))
              write_output("pr_body", pull_request.get("body", ""))
              write_output("pr_author", user.get("login", ""))
              write_output("pr_url", pull_request.get("html_url", ""))
          PY

      - name: 发送飞书通知
        env:
          EVENT_NAME: ${{ steps.event_info.outputs.event_name }}
          BRANCH: ${{ steps.event_info.outputs.ref_name }}
          REPOSITORY: ${{ steps.event_info.outputs.repository }}
          ACTOR: ${{ steps.event_info.outputs.actor }}
          SHA: ${{ steps.event_info.outputs.sha }}
          COMMIT_MSG: ${{ steps.event_info.outputs.commit_message }}
          COMMIT_AUTHOR: ${{ steps.event_info.outputs.commit_author }}
          COMMIT_DATE: ${{ steps.event_info.outputs.commit_date }}
          PR_TITLE: ${{ steps.event_info.outputs.pr_title }}
          PR_BODY: ${{ steps.event_info.outputs.pr_body }}
          PR_AUTHOR: ${{ steps.event_info.outputs.pr_author }}
          PR_URL: ${{ steps.event_info.outputs.pr_url }}
        run: |
          # 构建消息内容
          PROJECT_NAME="yishe-nuxt"
          
          # 根据事件类型构建不同的消息
          case $EVENT_NAME in
            "push")
              # 如果提交信息为空，使用备用方案
              if [ -z "$COMMIT_MSG" ]; then
                COMMIT_MSG="无提交信息"
              fi
              if [ -z "$COMMIT_AUTHOR" ]; then
                COMMIT_AUTHOR="$ACTOR"
              fi
              if [ -z "$COMMIT_DATE" ]; then
                COMMIT_DATE="未知时间"
              fi
              
              MESSAGE="🚀 代码推送通知\n\n📁 项目: $PROJECT_NAME\n🌿 分支: $BRANCH\n👤 提交者: $ACTOR\n📝 提交信息: $COMMIT_MSG\n👨‍💻 作者: $COMMIT_AUTHOR\n📅 提交时间: $COMMIT_DATE\n🔗 仓库: https://github.com/$REPOSITORY\n🔗 提交链接: https://github.com/$REPOSITORY/commit/$SHA"
              ;;
              
            "pull_request")
              MESSAGE="🔀 Pull Request 通知\n\n📁 项目: $PROJECT_NAME\n🌿 分支: $BRANCH\n👤 创建者: $PR_AUTHOR\n📝 PR标题: $PR_TITLE\n📄 PR描述: $PR_BODY\n🔗 仓库: https://github.com/$REPOSITORY\n🔗 PR链接: $PR_URL"
              ;;
              
            "create")
              MESSAGE="✨ 分支创建通知\n\n📁 项目: $PROJECT_NAME\n🌿 分支: $BRANCH\n👤 创建者: $ACTOR\n🔗 仓库: https://github.com/$REPOSITORY"
              ;;
              
            "delete")
              MESSAGE="🗑️ 分支删除通知\n\n📁 项目: $PROJECT_NAME\n🌿 分支: $BRANCH\n👤 删除者: $ACTOR\n🔗 仓库: https://github.com/$REPOSITORY"
              ;;
              
            *)
              MESSAGE="📢 Git事件通知\n\n📁 项目: $PROJECT_NAME\n🌿 分支: $BRANCH\n👤 操作者: $ACTOR\n📋 事件类型: $EVENT_NAME\n🔗 仓库: https://github.com/$REPOSITORY"
              ;;
          esac
          
          # 发送到飞书机器人 - 使用text格式。用 Python 生成 JSON，避免提交信息里的换行/引号破坏 payload。
          PAYLOAD=$(MESSAGE="$MESSAGE" python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "msg_type": "text",
              "content": {
                  "text": os.environ.get("MESSAGE", "")
              }
          }, ensure_ascii=False))
          PY
          )

          RESPONSE=$(curl -s -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://open.feishu.cn/open-apis/bot/v2/hook/143ed889-eace-42df-ba97-d8b2bac28e6d")
          
          # 检查响应
          HTTP_CODE="${RESPONSE: -3}"
          RESPONSE_BODY="${RESPONSE%???}"
          
          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $RESPONSE_BODY"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 飞书通知发送失败，HTTP状态码: $HTTP_CODE"
            echo "响应内容: $RESPONSE_BODY"
            exit 1
          else
            echo "✅ 飞书通知发送成功"
          fi 
